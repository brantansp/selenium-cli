# =============================================================================
# Selenium CLI ? Browser Configuration File
# Usage:  selenium> config --load-file config.properties
#         selenium  config --load-file config.properties   (one-shot)
#
# Supported key families:
#   browser.chrome.version           ? Chrome / CfT version for Selenium Manager
#   browser.chrome.arguments.*       ? raw Chrome flags (value = one or more --flags)
#   browser.chrome.preferences.*     ? Chrome prefs map  (suffix = pref key)
#   browser.chrome.capabilities.*    ? ChromeOptions.setCapability() (suffix = cap name)
#   browser.proxy.manual             ? proxy URL
#
# Variable interpolation supported in values:
#   ${sys:user.dir}                  ? System.getProperty("user.dir")
#   ${const:java.io.File.separator}  ? static field via reflection
#   ${name}                          ? value of another property in this file
#
# Lines starting with # are comments and are ignored by the loader.
# =============================================================================


# ?? Directory variables (used below via ${?} interpolation) ??????????????????

fs                  = ${const:java.io.File.separator}
download.directory  = ${sys:user.dir}${fs}Downloads
userdata.directory  = ${sys:user.dir}${fs}UserData
plugin.directory    = ${sys:user.dir}${fs}plugins


# =============================================================================
# BROWSER TYPE  (informational ? loader logs this as a warning, not an error)
# =============================================================================

browser.type = chrome


# =============================================================================
# CHROME VERSION
# Selenium Manager resolves the matching ChromeDriver and Chrome for Testing.
# Use "stable", "beta", "dev", or a specific major version number.
# =============================================================================

browser.chrome.version = 135
#browser.chrome.version = stable
#browser.chrome.version = 124


# =============================================================================
# CHROME ARGUMENTS
# Each key (suffix after "browser.chrome.arguments.") is just a label.
# The VALUE is the actual Chrome flag (or space-separated flags).
# Duplicate flags across keys are automatically deduplicated by the loader.
# =============================================================================

