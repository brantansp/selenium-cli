# ?? Performance / stability ???????????????????????????????????????????????????
browser.chrome.arguments.no-site-isolation = --disable-site-isolation-trials
browser.chrome.arguments.no-automation     = --disable-blink-features=AutomationControlled
browser.chrome.arguments.no-default-browser-check = --no-default-browser-check
#browser.chrome.arguments.no-first-run     = --no-first-run
#browser.chrome.arguments.single-process   = --single-process


