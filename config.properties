# ?? Window / display ?????????????????????????????????????????????????????????
#browser.chrome.arguments.maximize      = --start-maximized
browser.chrome.arguments.windowsize   = --window-size=1920,1080
#browser.chrome.arguments.kiosk        = --kiosk

# ?? Language / locale ?????????????????????????????????????????????????????????
browser.chrome.arguments.lang           = --lang=en-US

# ?? Remote / DevTools ????????????????????????????????????????????????????????
browser.chrome.arguments.remote-origins = --remote-allow-origins=*
browser.chrome.arguments.debugport    = --remote-debugging-port=9222

# ?? Security / certificates ??????????????????????????????????????????????????
browser.chrome.arguments.ignore-certs   = --ignore-certificate-errors
